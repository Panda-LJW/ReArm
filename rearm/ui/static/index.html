<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReArm · 自我校准控制台</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193d3a;background:#f2f5f3;line-height:1.5}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:30px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:29px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:0 0 18px}p{margin:4px 0;color:#617975;font-size:13px}.badge{font-size:12px;background:#e3eee8;padding:6px 12px;border-radius:6px}#connection{color:#617975}section,.metric{background:white;border:1px solid #dce6df;border-radius:10px;padding:22px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.metric span{display:block;font-size:12px;color:#617975}.metric strong{display:block;font-size:25px;margin-top:4px;font-weight:600;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}section.wide{grid-column:1/-1}button,select,input{font:inherit;font-size:13px;border:1px solid #bccfc4;border-radius:6px;padding:9px 12px;background:white;color:#193d3a}button{cursor:pointer}button.primary{background:#185d4a;color:white;border-color:#185d4a}button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:wait}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.damage{border-top:1px solid #e4ebe6;margin-top:20px;padding-top:14px}select{max-width:100%}canvas{display:block;width:100%;height:210px}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th{color:#617975;font-weight:500}th,td{padding:11px 9px;border-bottom:1px solid #ecf0ed;overflow-wrap:anywhere}.table-wrap{overflow-x:auto}.muted{color:#738780}.legend{display:flex;gap:20px;font-size:12px;color:#617975;margin-top:7px}.dot{display:inline-block;width:8px;height:8px;margin-right:5px;background:#1f7c60;border-radius:50%}.dot.gray{background:#a4afa8}#notice{min-height:24px;color:#98522f;font-size:13px;margin:12px 0}#diagnosis{font-size:16px;margin-bottom:10px}footer{font-size:12px;color:#738780;margin-top:20px}.scores{max-height:190px;overflow:auto}@media(max-width:760px){main{padding:20px 16px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:24px}section{padding:18px}th,td{padding:9px 6px}}
</style>
<main>
<header><div><h1>ReArm</h1><p>日新臂 · 自我校准控制台</p></div><div><span class="badge" id="mode">本地仿真</span><p id="connection" role="status">正在连接…</p></div></header>
<div class="metrics"><div class="metric"><span>当前状态</span><strong id="state">待连接</strong></div><div class="metric"><span>当前版本</span><strong id="version">—</strong></div><div class="metric"><span>最近残差 / mm</span><strong id="residual">—</strong></div><div class="metric"><span>累计报警 / 次</span><strong id="alarms">0</strong></div></div>
<div class="grid">
<section><h2>最近落点残差</h2><canvas id="residualChart" aria-label="最近落点残差毫米曲线"></canvas><p>横轴为发次，纵轴为误差（mm）；无光点的发次不连线。</p></section>
<section><h2>操作</h2><p>先完成基线校准，再自检；几何状态正常时可重训残差。</p><div class="controls"><button class="primary" data-command="selfcheck">自检 3 发</button><button data-command="baseline">基线校准</button><button data-command="retrain">重训残差</button></div><div class="damage" id="damageControls"><p>仿真伤注入</p><div class="controls"><select id="damage" aria-label="伤类型"><option value="j1:1">J1 错位 +1 格</option><option value="j1:-1">J1 错位 −1 格</option><option value="j2:1">J2 错位 +1 格</option><option value="j2:2">J2 错位 +2 格</option><option value="extension:20">延长杆 +20 mm</option><option value="extension:40">延长杆 +40 mm</option><option value="base_x:20">底座平移 20 mm</option><option value="base_rotation:10">底座旋转 10°</option><option value="weight:0">加配重</option><option value="loose:0">松动</option><option value="restore:0">复原</option></select><button id="inject">注入</button></div></div><div id="notice" role="status" aria-live="polite"></div></section>
<section><h2>版本与留出误差</h2><canvas id="versionChart" aria-label="版本留出误差及只用几何对照曲线"></canvas><div class="legend"><span><i class="dot"></i>当前模型</span><span><i class="dot gray"></i>只用几何</span></div><p>只有实测留出数据的版本才显示；残差训练按时间留出。</p></section>
<section><h2>诊断</h2><div id="diagnosis">尚无诊断</div><p id="ambiguity"></p><div class="scores"><table><thead><tr><th>假设</th><th>BIC</th><th>RMS / mm</th></tr></thead><tbody id="scores"></tbody></table></div></section>
<section class="wide"><h2>版本记录</h2><p>回退内容：<select id="component" aria-label="回退内容"><option value="both">几何与残差</option><option value="geometry">仅几何</option><option value="residual">仅残差</option></select></p><div class="table-wrap"><table><thead><tr><th>版本</th><th>状态</th><th>残差模型</th><th>留出误差 / mm</th><th>操作</th></tr></thead><tbody id="versions"></tbody></table></div></section>
</div><footer>全部计算在本机完成 · 真机联调不在 v0 范围</footer>
</main>
<script>
(()=>{'use strict';let state=null,busy=false;const $=id=>document.getElementById(id),fmt=x=>Number.isFinite(x)?x.toFixed(2):'—';
function chart(id,series,labels){const el=$(id),r=el.getBoundingClientRect(),d=window.devicePixelRatio||1;el.width=r.width*d;el.height=r.height*d;const c=el.getContext('2d');c.scale(d,d);const w=r.width,h=r.height,p=38;const vals=series.flatMap(s=>s.values).filter(Number.isFinite),max=Math.max(1,...vals)*1.15;c.font='11px system-ui';for(let k=0;k<=3;k++){let y=h-p-(h-2*p)*k/3;c.strokeStyle='#e8eeea';c.beginPath();c.moveTo(p,y);c.lineTo(w-12,y);c.stroke();c.fillStyle='#71847b';c.fillText((max*k/3).toFixed(1),1,y+4)}series.forEach(s=>{c.strokeStyle=s.color;c.lineWidth=2;c.beginPath();let pen=false;s.values.forEach((v,i)=>{if(!Number.isFinite(v)){pen=false;return}let x=p+(w-p-14)*i/Math.max(labels.length-1,1),y=h-p-(h-2*p)*v/max;pen?c.lineTo(x,y):c.moveTo(x,y);pen=true});c.stroke();s.values.forEach((v,i)=>{if(!Number.isFinite(v))return;c.beginPath();c.arc(p+(w-p-14)*i/Math.max(labels.length-1,1),h-p-(h-2*p)*v/max,2.5,0,Math.PI*2);c.fillStyle=s.color;c.fill()})});c.fillStyle='#71847b';if(!labels.length)c.fillText('等待实测数据',p,h/2);labels.forEach((l,i)=>{if(i===0||i===labels.length-1||labels.length<7){let x=p+(w-p-14)*i/Math.max(labels.length-1,1);c.fillText(String(l),Math.min(x,w-44),h-12)}})}
function row(cells){let tr=document.createElement('tr');cells.forEach(v=>{let td=document.createElement('td');if(v instanceof Node)td.append(v);else td.textContent=v;tr.append(td)});return tr}
function render(){if(!state)return;$('state').textContent=state.state;$('version').textContent=state.head.id;$('alarms').textContent=state.alarms;$('mode').textContent=state.simulation?'本地仿真':'本地硬件';$('damageControls').hidden=!state.simulation;const shots=state.recent||[],errors=shots.map(s=>s.residual?Math.hypot(...s.residual):null);$('residual').textContent=errors.length?fmt(errors.at(-1)):'—';chart('residualChart',[{values:errors,color:'#1f7c60'}],shots.map((s,i)=>Math.max(1,state.shots-shots.length+i+1)));const d=state.diagnosis;$('diagnosis').textContent=d?d.best.name+' · '+Object.entries(d.gear_steps).map(([k,v])=>k+' '+(v>=0?'+':'')+v+' 格').join('，'):'尚无诊断';$('ambiguity').textContent=d&&d.ambiguous.length?'仅凭落点无法区分 J1 零偏与底座朝向变化。':'';$('scores').replaceChildren(...(d?d.ranked:[]).map(h=>row([h.name,fmt(h.bic),fmt(h.fit.rms)])));const versions=state.versions||[];$('versions').replaceChildren(...versions.slice().reverse().map(v=>{const btn=document.createElement('button');btn.textContent=v.id===state.head.id?'当前版本':'回退';btn.disabled=!v.accepted||busy||v.id===state.head.id;btn.onclick=()=>command('rollback',{version_id:v.id,component:$('component').value});return row([v.id,v.accepted?'已采纳':'已拒绝',v.residual_id,fmt(v.meta.training?.new_median??v.meta.guard?.candidate_median),btn])}));const measured=versions.filter(v=>v.accepted&&(v.meta.training||v.meta.guard));chart('versionChart',[{values:measured.map(v=>v.meta.training?.geometry_median??v.meta.guard?.candidate_median),color:'#a4afa8'},{values:measured.map(v=>v.meta.training?.new_median??v.meta.guard?.candidate_median),color:'#1f7c60'}],measured.map(v=>v.id));}
async function command(name,payload={}){busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('notice').textContent='执行中…';try{let response=await fetch('/api/command/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw Error(data.detail||'执行失败');state=data;$('notice').textContent='操作完成';}catch(error){$('notice').textContent=error.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);render()}}
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));$('inject').onclick=()=>{let[kind,amount]=$('damage').value.split(':');command('inject',{kind,amount:Number(amount)})};function connect(){let socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');socket.onopen=()=>{$('connection').textContent='实时连接'};socket.onmessage=event=>{let e=JSON.parse(event.data);if(e.kind==='snapshot')state=e.data.snapshot;else if(state&&e.kind==='state')state.state=e.data.state;else if(state&&e.kind==='shot'){state.recent=[...state.recent,e.data.shot].slice(-state.history_limit);state.shots++}else if(state&&e.kind==='diagnosis')state.diagnosis=e.data.diagnosis;render()};socket.onclose=()=>{$('connection').textContent='连接断开，正在重连';setTimeout(connect,1500)}}window.addEventListener('resize',render);connect();})();
</script>
</html>
